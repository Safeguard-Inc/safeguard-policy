[workspace]
resolver = "2"
members = [
    "crates/safeguard-contract",
    "crates/safeguard-core",
]

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/Safeguard-Inc/safeguard-policy"
authors = ["Safeguard"]

# Shared lint policy: no unsafe code anywhere in the workspace. The contract
# crate narrows this to `allow` for soroban-sdk macro-generated harness code.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release profile tuned for Soroban wasm artifacts (applies to every member;
# the contract is the only cdylib in the workspace).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
