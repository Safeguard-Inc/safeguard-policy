[workspace]
resolver = "2"
members = [
    "crates/safeguard-core",
]

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/Safeguard-Inc/safeguard-policy"
authors = ["Safeguard"]

# Shared lint policy: no unsafe code anywhere in the workspace.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
