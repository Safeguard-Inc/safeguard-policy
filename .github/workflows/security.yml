name: Security

on:
  schedule:
    # Nightly dependency-advisory sweep (cargo-deny and npm audit fetch the
    # latest advisory databases).
    - cron: "0 3 * * *"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - "sdk/typescript/package.json"
      - "sdk/typescript/package-lock.json"
  workflow_dispatch:

jobs:
  cargo-deny:
    name: Rust advisories & licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny-action runs in its own container with a pinned cargo-deny
      # binary, so no host Rust toolchain is needed here.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  npm-audit:
    name: TypeScript dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --audit-level=high