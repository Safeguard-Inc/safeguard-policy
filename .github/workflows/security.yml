name: Security

on:
  schedule:
    # Nightly dependency-advisory sweep (cargo-deny and npm audit fetch the
    # latest advisory databases).
    - cron: "0 3 * * *"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - "sdk/typescript/package.json"
      - "sdk/typescript/package-lock.json"
  workflow_dispatch:

jobs:
  cargo-deny:
    name: Rust advisories & licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # cargo-deny-action runs in its own container with a pinned cargo-deny
      # binary, so no host Rust toolchain is needed here.
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

  npm-audit:
    name: TypeScript dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --audit-level=high