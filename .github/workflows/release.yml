name: Release

on:
  push:
    tags:
      - "v*"

# A release cut is per-tag by definition, so runs can never collide; the
# group still guards against a forced tag re-push racing an in-flight gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: nothing here needs a write token except the job that
# creates the GitHub release. Every other job — including the ones holding
# third-party registry tokens — runs read-only, so a compromised step cannot
# tamper with repository content while publishing.
permissions:
  contents: read

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install validation dependencies
        run: python3 -m pip install jsonschema

      - name: Add Soroban wasm target
        run: rustup target add wasm32v1-none

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

      - name: Run the full gate
        run: |
          npm ci --no-audit --no-fund --prefix sdk/typescript
          ./scripts/ci.sh all

  build:
    name: Build artifacts
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Add Soroban wasm target
        run: rustup target add wasm32v1-none

      - name: Build the contract wasm artifact
        run: cargo build --locked -p safeguard-contract --target wasm32v1-none --release

      - name: Build the CLI binary
        run: cargo build --locked -p safeguard-cli --release

      - name: Build the TypeScript SDK package
        run: |
          npm ci --no-audit --no-fund --prefix sdk/typescript
          npm run build --prefix sdk/typescript

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/wasm32v1-none/release/safeguard_contract.wasm dist/
          cp target/release/safeguard-cli dist/
          cp -r policy-schema dist/policy-schema
          cp -r policies dist/policies
          tar czf dist/safeguard-policy-schemas.tar.gz policy-schema policies
          tar czf dist/safeguard-sdk-typescript.tar.gz -C sdk/typescript dist package.json README.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safeguard-dist
          path: dist/

  publish-crates:
    name: Publish Rust crates to crates.io
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable

      # The `secrets` context is NOT available in job-level `if` expressions:
      # referencing it there makes GitHub reject the whole workflow file at
      # validation time (every push fails with zero jobs). The publish gate
      # therefore lives inside the step: with a token the crates go out in
      # dependency order (core → sdk → adapters → cli — each publish must be
      # visible to the registry before the next resolves its path deps);
      # without one the step no-ops with a notice and the job stays green.
      - name: Publish the crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not configured — skipping crates.io publishing."
            exit 0
          fi
          # --locked: publish exactly what the committed lockfile pins. Every
          # other gate builds --locked; publishing must not quietly resolve
          # fresh dependency versions that were never built or audited.
          cargo publish --locked -p safeguard-core
          cargo publish --locked -p safeguard-sdk
          cargo publish --locked -p safeguard-adapters
          cargo publish --locked -p safeguard-cli

  publish-npm:
    name: Publish TypeScript SDK to npm
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
          registry-url: "https://registry.npmjs.org"

      # Same job-level `secrets` caveat as publish-crates: gate inside the
      # step so the workflow file stays valid.
      - name: Build and publish @safeguard/policy-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci --no-audit --no-fund --prefix sdk/typescript
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not configured — skipping npm publishing."
            exit 0
          fi
          npm publish --prefix sdk/typescript

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: safeguard-dist
          path: dist/

      - name: Draft the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Safeguard Policy v${VERSION}"
            echo
            echo "See [CHANGELOG.md](CHANGELOG.md) for the full list of changes."
            echo
            echo "### Artifacts"
            echo
            echo "- \`safeguard_contract.wasm\` — the Soroban policy contract (wasm32v1-none)"
            echo "- \`safeguard-cli\` — the operator CLI binary"
            echo "- \`safeguard-policy-schemas.tar.gz\` — JSON Schemas + reference policies"
            echo "- \`safeguard-sdk-typescript.tar.gz\` — the TypeScript SDK package"
          } > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/safeguard_contract.wasm \
            dist/safeguard-cli \
            dist/safeguard-policy-schemas.tar.gz \
            dist/safeguard-sdk-typescript.tar.gz \
            --title "safeguard-policy ${GITHUB_REF_NAME}" \
            --notes-file notes.md