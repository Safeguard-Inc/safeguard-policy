name: CI

on:
  push:
    branches: [main]
  pull_request:

# One active run per (workflow, ref): a rapid push sequence supersedes stale
# runs instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: workflow files (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validate every workflow with actionlint before anything else runs.
      # This gate exists because a workflow file GitHub rejects at validation
      # time (e.g. a step-level-only context such as `secrets` referenced in
      # a job-level `if`) surfaces as a zero-job failure that YAML parsers
      # silently tolerate — and a broken release pipeline then hides behind
      # a green CI. The binary is pinned to an exact release and verified
      # against the upstream checksum before use: a compromised download or
      # a silently changed "latest" artifact cannot weaken the gate.
      - name: Lint workflow files (pinned actionlint, checksum-verified)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check --
          mkdir /tmp/actionlint && tar xzf /tmp/actionlint.tar.gz -C /tmp/actionlint
          /tmp/actionlint/actionlint -color

  rust:
    name: Rust gate (fmt, clippy, tests, wasm)
    runs-on: ubuntu-latest
    # Bounded runtime: a hung job fails fast instead of burning the 6-hour
    # runner default (the gate completes in ~5 minutes locally).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Add Soroban wasm target
        run: rustup target add wasm32v1-none

      - name: Run the Rust gate
        run: ./scripts/ci.sh rust

  coverage:
    name: Coverage gate (≥80% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-llvm-cov

      - name: Coverage gate (scripts/coverage.sh)
        run: bash scripts/coverage.sh

  schema:
    name: Policy schema & fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install jsonschema

      - name: Schema test battery (meta-schema, parity, negative cases)
        run: python3 scripts/test-schema.py

      - name: Fixture and policy cross-reference consistency
        run: python3 scripts/check-fixtures.py

      - name: Validate reference policies
        run: >-
          python3 scripts/validate_policy.py
          policies/default/policy.json
          policies/examples/*.json

  typescript:
    name: TypeScript SDK (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, build and run tests
        run: npm test