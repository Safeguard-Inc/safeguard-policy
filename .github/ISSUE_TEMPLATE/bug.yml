name: Bug report
description: Something is not behaving as documented
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. If this is a security issue, do **not** open
        a public issue — report privately per SECURITY.md.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the policy document, input facts, and the exact call if possible.
      placeholder: |
        1. Register/activate policy X
        2. Call evaluate(policy, token, { ... })
        3. Observed decision ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which layer is affected?
      options:
        - safeguard-core (engine)
        - safeguard-contract (on-chain)
        - policy-schema / policies
        - scripts / CI
        - docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Which commit or release are you on?
    validations:
      required: true