version: 2
updates:
  # Cargo workspace (soroban-sdk, etc.). Dependency bumps are validated by
  # the CI gate (fmt, clippy, tests, wasm build) before merge.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5