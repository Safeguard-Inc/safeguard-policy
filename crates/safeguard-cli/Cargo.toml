[package]
name = "safeguard-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Operator CLI for Safeguard: validate, inspect and evaluate policy documents offline"
keywords = ["stellar", "soroban", "compliance", "policy", "cli"]
categories = ["cryptography::cryptocurrencies"]

[lints]
workspace = true

[dependencies]
safeguard-sdk = { path = "../safeguard-sdk", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"