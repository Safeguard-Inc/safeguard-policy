[package]
name = "safeguard-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Off-chain Rust SDK for Safeguard: policy documents, validation and offline evaluation"
keywords = ["stellar", "soroban", "compliance", "policy", "sdk"]
categories = ["cryptography::cryptocurrencies"]

[lints]
workspace = true

[dependencies]
safeguard-core = { path = "../safeguard-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"