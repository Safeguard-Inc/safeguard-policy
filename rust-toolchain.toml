# Rust toolchain, pinned to an exact release for the whole workspace.
#
# Why an exact version, not `stable`: `docs/gas.md` publishes stroop and wasm
# byte counts, and those are a property of the compiler as much as of the
# source. Under a floating `stable` a published figure is a point-in-time
# observation that a reviewer cannot reproduce — the same source built with a
# different stable moved `compliance_hooks.wasm` by ~6% in the sibling
# `safeguard-hooks` repo. The pin makes a measurement a claim someone can check.
#
# Bumping the pin (one line, and the only line that should ever change here):
#
#   1. edit `channel` below to the new release (Dependabot proposes bumps);
#   2. run `bash scripts/install-toolchain.sh` then the Rust gate:
#        ./scripts/ci.sh rust
#   3. re-measure and update the numbers in `docs/gas.md` in the SAME change —
#      the figures and the pin belong to each other;
#   4. note the release next to the measurement so the two stay in step.
#
# CI installs this pin through `scripts/install-toolchain.sh`, which reads
# `channel` from this file and fails if the resolved version is not the pin, so
# a workflow cannot silently build with some other channel.
#
# - soroban-sdk 27 requires Rust >= 1.91
# - rustfmt and clippy are used by the CI gate and installed automatically for
#   contributors who use rustup
# - wasm32v1-none is the Soroban target (the Soroban environment does not
#   support wasm32-unknown-unknown on Rust 1.82+); declaring it here means
#   `rustup` installs it with the toolchain instead of needing a manual step
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
targets = ["wasm32v1-none"]
profile = "minimal"
